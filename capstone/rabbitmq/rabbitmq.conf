# Capstone kit: RabbitMQ configuration. Not replaced at grading, but keep it.
#
# definitions.json is the §3.2 topology and the `eai` user. It is imported at
# every boot, before the node accepts connections. With a definitions file,
# RabbitMQ creates no guest user.
load_definitions = /etc/rabbitmq/definitions.json

# How often a busy queue reports its figures to the management API (default
# 5000 ms). An idle queue can still report late: see README §4.9.
collect_statistics_interval = 1000
