{
  "openapi": "3.0.3",
  "info": {
    "title": "Parminder Singh checkout saga",
    "version": "1.0.0",
    "description": "Synchronous checkout with sequential calls, bounded request size, compensating actions, and restart-persistent idempotency. An interrupted in-progress operation remains conflicted until an operator reconciles it.",
    "contact": {
      "name": "Parminder Singh"
    },
    "license": {
      "name": "Course assignment"
    }
  },
  "servers": [
    {
      "url": "http://localhost:3000",
      "description": "Local PA6 Compose endpoint"
    }
  ],
  "tags": [
    {
      "name": "Checkout",
      "description": "Checkout execution and health"
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "tags": [
          "Checkout"
        ],
        "operationId": "readHealth",
        "summary": "Read process health",
        "description": "Reports process liveness; it does not probe downstream providers.",
        "responses": {
          "200": {
            "description": "Process is serving requests.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          }
        }
      }
    },
    "/checkout": {
      "post": {
        "tags": [
          "Checkout"
        ],
        "operationId": "executeCheckout",
        "summary": "Execute or replay one checkout",
        "description": "Authorize payment, reserve stock, create shipping, then notify. A failed step stops forward progress. Completed inventory and payment calls are compensated in reverse order. Same-key requests replay a terminal result, conflict during execution, or reject mismatched payloads. Compensation failure takes precedence over the original timeout or refusal.",
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "description": "Client-chosen key, up to 200 characters. Object key order does not change payload identity. An in-progress record survives crashes and is not automatically retried.",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200
            }
          }
        ],
        "requestBody": {
          "required": true,
          "description": "Canonical order with at most 100 lines. Payment receives the sum of quantity times decimal unitPrice, without adding tax.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CheckoutOrder"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "All four steps completed, or a successful stored result was replayed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SagaOutcome"
                }
              }
            }
          },
          "400": {
            "description": "Missing key, malformed JSON, invalid canonical body, or item/key bound exceeded.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RequestError"
                }
              }
            }
          },
          "409": {
            "description": "Key is in progress or associated with a different canonical payload.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RequestError"
                }
              }
            }
          },
          "413": {
            "description": "JSON body exceeds the one-megabyte transport limit.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RequestError"
                }
              }
            }
          },
          "422": {
            "description": "A service refused or failed, or compensation failed. Failed compensation sets compensation_failed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SagaOutcome"
                }
              }
            }
          },
          "504": {
            "description": "A forward service call timed out; all applicable compensation calls succeeded.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SagaOutcome"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "DeliveryAddress": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "street",
          "city",
          "postalCode",
          "country"
        ],
        "properties": {
          "street": {
            "type": "string",
            "minLength": 1
          },
          "city": {
            "type": "string",
            "minLength": 1
          },
          "postalCode": {
            "type": "string",
            "minLength": 1
          },
          "country": {
            "type": "string",
            "description": "ISO 3166-1 alpha-2, e.g. \"LV\", \"GB\"."
          }
        }
      },
      "Buyer": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "email",
          "address"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "address": {
            "$ref": "#/components/schemas/DeliveryAddress"
          }
        }
      },
      "PricedLine": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "productId",
          "productName",
          "quantity",
          "unitPrice",
          "currency",
          "taxRate"
        ],
        "properties": {
          "productId": {
            "type": "string",
            "pattern": "^PROD-[0-9]+$",
            "description": "Normalized to the pricing API's own format before enrichment. See each translator for its source-specific normalization rule."
          },
          "productName": {
            "type": "string",
            "minLength": 1
          },
          "quantity": {
            "type": "integer",
            "minimum": 1
          },
          "unitPrice": {
            "type": "string",
            "pattern": "^-?[0-9]+\\.[0-9]{2}$",
            "description": "A decimal STRING with exactly two fraction digits, e.g. \"24.99\". NEVER a JSON number \u00e2\u20ac\u201d a float silently loses trailing zeros and, eventually, cents. Comes from the pricing API's response, not from the source order (which does not carry a trustworthy price)."
          },
          "currency": {
            "type": "string",
            "description": "The currency the unitPrice is denominated in, as returned by the pricing API. May differ from the order-level currency below."
          },
          "taxRate": {
            "type": "number",
            "minimum": 0,
            "maximum": 1,
            "description": "Fraction, e.g. 0.21 for 21%. Not a monetary amount, so a number is fine here."
          }
        }
      },
      "CheckoutOrder": {
        "description": "The canonical order model. Owned by the course, not by any assignment. From PA4 onward, every assignment reads or writes exactly this shape \u00e2\u20ac\u201d do not add, rename or retype a field, even if your source system makes that convenient. There is deliberately no field for payment/card/IBAN details: a source that carries one gets it stripped during transformation (content filter pattern).",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "orderId",
          "orderType",
          "source",
          "receivedAt",
          "orderDate",
          "customer",
          "items",
          "currency",
          "status"
        ],
        "properties": {
          "orderId": {
            "type": "string",
            "minLength": 1,
            "description": "The order id as given by the source system. Not renumbered."
          },
          "orderType": {
            "type": "string",
            "enum": [
              "standard",
              "express",
              "b2b"
            ],
            "description": "The business order type. One-to-one with source in this course's fixtures, but modelled separately because a future source could carry a different orderType than its channel implies."
          },
          "source": {
            "type": "string",
            "enum": [
              "web",
              "mobile",
              "b2b"
            ],
            "description": "Which translator produced this record. Provenance, not a business field."
          },
          "receivedAt": {
            "type": "string",
            "format": "date-time",
            "description": "When the canonical translator produced this record (its own clock), not the order's own timestamp. Excluded from cross-source structural comparisons for that reason."
          },
          "orderDate": {
            "type": "string",
            "format": "date-time",
            "description": "The order's own timestamp, normalized to ISO-8601 UTC regardless of the source's original representation (string, or Unix epoch seconds)."
          },
          "customer": {
            "$ref": "#/components/schemas/Buyer"
          },
          "items": {
            "type": "array",
            "minItems": 1,
            "items": {
              "$ref": "#/components/schemas/PricedLine"
            },
            "maxItems": 100,
            "description": "Between one and 100 priced lines; totals are calculated in whole cents."
          },
          "currency": {
            "type": "string",
            "description": "The order-level currency, as declared by the source (after mapping, e.g. ISO 4217 numeric -> alpha)."
          },
          "status": {
            "type": "string",
            "enum": [
              "new",
              "processing",
              "shipped",
              "delivered"
            ]
          }
        }
      },
      "StepTrace": {
        "type": "object",
        "additionalProperties": false,
        "description": "A completed call, including failed calls and compensation calls.",
        "required": [
          "step",
          "status",
          "startedAt",
          "finishedAt",
          "durationMs"
        ],
        "properties": {
          "step": {
            "type": "string",
            "enum": [
              "payment",
              "inventory",
              "shipping",
              "notification",
              "inventory_release",
              "payment_refund"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "success",
              "failed",
              "timeout"
            ]
          },
          "startedAt": {
            "type": "string",
            "format": "date-time"
          },
          "finishedAt": {
            "type": "string",
            "format": "date-time"
          },
          "durationMs": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "SagaOutcome": {
        "type": "object",
        "additionalProperties": false,
        "description": "Terminal checkout result, persisted and replayed without modification.",
        "required": [
          "orderId",
          "status",
          "trace"
        ],
        "properties": {
          "orderId": {
            "type": "string",
            "minLength": 1
          },
          "status": {
            "type": "string",
            "enum": [
              "completed",
              "failed",
              "compensated"
            ]
          },
          "code": {
            "type": "string",
            "description": "Failure code from the service, timeout, or compensation_failed; absent on success."
          },
          "trace": {
            "type": "array",
            "maxItems": 6,
            "items": {
              "$ref": "#/components/schemas/StepTrace"
            },
            "description": "Actual call order; at most four forward and two compensation calls."
          }
        }
      },
      "RequestError": {
        "type": "object",
        "additionalProperties": false,
        "description": "Validation or idempotency failure; no new downstream calls were started.",
        "required": [
          "code",
          "message"
        ],
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "validation_error",
              "idempotency_conflict",
              "idempotency_payload_mismatch"
            ]
          },
          "message": {
            "type": "string",
            "minLength": 1
          }
        }
      },
      "Health": {
        "type": "object",
        "required": [
          "status"
        ],
        "additionalProperties": false,
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok"
            ]
          }
        }
      }
    }
  }
}
